<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Order and sizes matter: browsers score candidates by declared size against the size they
      need (~32px for a tab). Anything advertising an exact 32x32 outranks the unsized SVG, so
      a second PNG link here would win and we'd lose the SVG's light/dark adaptation. Keep it
      to these three: .ico pinned to 32x32 for legacy, scalable SVG for modern, PNG for iOS.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Full-stack software developer with %PRO_YEARS%+ years of professional experience building web apps, SaaS products and websites, from the API to the interface." />
    <title>Jeremy Gervais | Software Developer</title>
    <link rel="canonical" href="https://jeremygervais.ca/" />
    <meta name="author" content="Jeremy Gervais" />
    <meta name="theme-color" content="#1b1720" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-friendly summary" />

    <!-- Link previews (Slack, LinkedIn, iMessage, Discord, X…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jeremy Gervais" />
    <meta property="og:url" content="https://jeremygervais.ca/" />
    <meta property="og:title" content="Jeremy Gervais | Software Developer" />
    <meta property="og:description" content="Full-stack software developer with %PRO_YEARS%+ years of professional experience building web apps, SaaS products and websites, from the API to the interface." />
    <meta property="og:image" content="https://jeremygervais.ca/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jeremy Gervais — Software Developer" />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data, so search engines and AI tools can tie this site to the same person elsewhere. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jeremy Gervais",
        "url": "https://jeremygervais.ca/",
        "image": "https://jeremygervais.ca/og-image.png",
        "jobTitle": "Software Developer",
        "worksFor": { "@type": "Organization", "name": "LoginID", "url": "https://loginid.ai/" },
        "address": { "@type": "PostalAddress", "addressRegion": "ON", "addressCountry": "CA" },
        "sameAs": [
          "https://github.com/ordomigato",
          "https://www.linkedin.com/in/jeremy-gervais/",
          "https://www.behance.net/fakiescript"
        ],
        "knowsAbout": ["TypeScript", "React", "Vue", "Nuxt", "Node.js", "Go", "PostgreSQL", "AWS", "Passkeys", "Web accessibility"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Netlify's form detector only scans the static HTML it deploys — it never runs this
      page's JavaScript, so it can't see the React-rendered form in Contact.tsx. This hidden
      twin exists purely so the build picks up the form; it's never shown or submitted itself.
      Field names here must stay in sync with the real form.
    -->
    <form name="Contact Form" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
